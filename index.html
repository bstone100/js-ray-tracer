<!doctype html>
<html lang="en">
<head>
    <title>Ray Tracer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>My first ray tracer</h1>
    <p>This is my first attempt to write a ray tracer. It's inspired by the book <cite><a href="" target="_blank">Ray Tracing in One Weekend</a> by Peter Shirley</cite> and the book <cite><a href="" target="_blank">Computer Graphics from Scratch</a> by Gabriel Gambetta</cite>.
    <p>The first version is going to be just rendering some spheres in a <code>&lt;canvas&gt;</code> element.</p>

    <canvas width="500" height="500"></canvas>

    <script>
        // let's implement the ray tracer here

        const size = 500;
        const canvasWidth = size;
        const canvasHeight = size;

        const canvas = document.querySelector("canvas");
        const canvas_context = canvas.getContext("2d");
        const canvas_buffer = canvas_context.getImageData(0, 0, canvasWidth, canvasHeight);

        // let's start by painting the canvas red, pixel by pixel
        // the buffer gets filled with [px 00 r, px 00 g, px 00 b, px 00 a, px 01 r, px 01 g, px 01 b, px 01 a, ...]

        for (let row = 0; row < canvasHeight; row++) {
            for (let col = 0; col < canvasWidth; col++) {
                const redIndex = 4 * (canvasWidth * row + col);
                canvas_buffer.data[redIndex] = 255; // r
                canvas_buffer.data[redIndex + 1] = 0; // g
                canvas_buffer.data[redIndex + 2] = 0; // b
                canvas_buffer.data[redIndex + 3] = 255 // a
            }
        }

        canvas_context.putImageData(canvas_buffer, 0, 0);


        // we're going to use a left-handed coordinate system, where the camera points toward the +Z axis


        // let's now start describing our scene

        const camera = {
            center: {
                x: 0,
                y: 0,
                z: 0
            },
            direction: {
                x: 0,
                y: 0,
                z: 1
            }
        };

        const scene = [
            {
                name: "s1",
                center: {
                    x: -0.5,
                    y: 0.5,
                    z: 2.0
                },
                radius: 0.2,
                color: "red",
                type: "sphere"
            },
            {
                name: "s2",
                center: {
                    x: 0,
                    y: 0,
                    z: 1.5
                },
                radius: 0.15,
                color: "green",
                type: "sphere"
            },
            {
                name: "s3",
                center: {
                    x: 0.5,
                    y: -0.5,
                    z: 2.5
                },
                radius: 0.25,
                color: "blue",
                type: "sphere"
            }
        ];

        // let's define the viewport with two points so that its plane is implied
        const viewport = {
            topLeft: {
                x: -1.0,
                y: 1.0,
                z: 1.0
            },
            bottomRight: {
                x: 1.0,
                y: -1.0,
                z: 1.0
            },
            get top() {
                return this.topLeft.y;
            },
            get bottom() {
                return this.bottomRight.y;
            },
            get left() {
                return this.topLeft.x;
            },
            get right() {
                return this.bottomRight.x;
            },
            get height() {
                return this.top - this.bottom;
            },
            get width() {
                return this.right - this.left;
            }
        };

        function dot(vec1, vec2) {
            return (vec1.x * vec2.x) + (vec1.y * vec2.y) + (vec1.z * vec2.z);
        }

        function sub(vec1, vec2) {
            return {
                x: vec1.x - vec2.x,
                y: vec1.y - vec2.y,
                z: vec1.z - vec2.z
            };
        }


        // now that the scene is set up, we can actually render it to the canvas

        // let's begin setting up the ray tracer
        // we will be casting one ray per pixel, from the camera center to the pixel center

        const pixelWidth = viewport.width / canvasWidth;
        const pixelHeight = viewport.height / canvasHeight;

        for (let row = 0; row < canvasHeight; row++) {
            for (let col = 0; col < canvasWidth; col++) {
                // determine the location in 3D of the center of this pixel

                const pixelCenter = {
                    x: viewport.left + (pixelWidth / 2) + (col * pixelWidth),
                    y: viewport.top - (pixelHeight / 2) - (row * pixelHeight),
                    z: viewport.topLeft.z // all pixels are somewhere on the viewport plane
                };

                const ray = {
                    origin: camera.center,
                    direction: pixelCenter
                };

                // now it's time to cast our ray and see what it hits
                // we want to determine if the ray hits any objects, and if so, which object is the closest to the camera
                // then, we can paint this pixel with the color of that object

                let min_t = Infinity; // the lowest t value
                let closest_object = null;

                // let's start by looping through our scene (which is a 1D array of objects now, but could be a tree of objects later)
                for (const object of scene) {
                    // we are just going to handle spheres for now
                    if (object.type === "sphere") {
                        // we need to determine if there is a point along the ray which is also on the surface of the sphere
                        // we can describe the sphere as |C - P| = r, meaning the length of the vector from any point P on the sphere surface to the sphere center C is equal to the sphere radius
                        // we can describe the ray as P(t) = Q + td, where Q is the ray origin, d is the ray direction, t is a scalar
                        // this means that any point P along the ray has a value t such that Q + td = P

                        // we are looking for a point P that satisfies both the sphere surface equation and the ray equation
                        // this means we can insert the ray equation into the sphere surface equation like this: |C - (Q + td)| = r
                        // now, we just need to solve this equation for t, meaning we need to determine if there is a value of t that makes the equation true

                        // when you work through the linear algebra, you find that this equation is quadratic and can be solved with the quadratic formula, which I'm about to do:

                        const a = dot(ray.direction, ray.direction);
                        const b = -2 * dot(ray.direction, sub(object.center, ray.origin));
                        const c = dot(sub(object.center, ray.origin), sub(object.center, ray.origin)) - Math.pow(object.radius, 2);

                        const discriminant = Math.pow(b, 2) - 4 * a * c;

                        // if there are one or two intersection points
                        if (discriminant >= 0) {
                            // we just need the smaller t value for now because the hit point is closer to the camera
                            const t = (-b - Math.sqrt(discriminant)) / (2 * a);

                            // with this t value, we now can compute exactly where our ray hits this sphere
                            // but we don't need to do that quite yet

                            if (t < min_t) {
                                min_t = t;
                                closest_object = object;
                            }
                        }

                    }
                }
            }
        }






    </script>


</body>
</html>
