<!doctype html>
<html lang="en">
<head>
    <title>Ray Tracer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>My first ray tracer</h1>
    <p>This is my first attempt to write a ray tracer. It's inspired by the book <cite><a href="" target="_blank">Ray Tracing in One Weekend</a> by Peter Shirley</cite> and the book <cite><a href="" target="_blank">Computer Graphics from Scratch</a> by Gabriel Gambetta</cite>.
    <p>The first version is going to be just rendering some spheres in a <code>&lt;canvas&gt;</code> element.</p>

    <canvas width="500" height="500"></canvas>

    <script>
        // let's implement the ray tracer here

        const size = 500;
        const width = size;
        const height = size;

        const canvas = document.querySelector("canvas");
        const canvas_context = canvas.getContext("2d");
        const canvas_buffer = canvas_context.getImageData(0, 0, width, height);

        // let's start by painting the canvas red, pixel by pixel
        // the buffer gets filled with [px 00 r, px 00 g, px 00 b, px 00 a, px 01 r, px 01 g, px 01 b, px 01 a, ...]

        for (let row = 0; row < height; row++) {
            for (let col = 0; col < width; col++) {
                const redIndex = 4 * (width * row + col);
                canvas_buffer.data[redIndex] = 255; // r
                canvas_buffer.data[redIndex + 1] = 0; // g
                canvas_buffer.data[redIndex + 2] = 0; // b
                canvas_buffer.data[redIndex + 3] = 255 // a
            }
        }

        canvas_context.putImageData(canvas_buffer, 0, 0);





    </script>


</body>
</html>
