<!doctype html>
<html lang="en">
<head>
    <title>Ray Tracer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>My first ray tracer</h1>
    <p>This is my first attempt to write a ray tracer. It's inspired by the book <cite><a href="" target="_blank">Ray Tracing in One Weekend</a> by Peter Shirley</cite> and the book <cite><a href="" target="_blank">Computer Graphics from Scratch</a> by Gabriel Gambetta</cite>.
    <p>The first version is going to be just rendering some spheres in a <code>&lt;canvas&gt;</code> element.</p>

    <canvas width="500" height="500"></canvas>

    <script>
        // let's implement the ray tracer here

        const size = 500;
        const canvasWidth = size;
        const canvasHeight = size;

        const canvas = document.querySelector("canvas");
        const canvas_context = canvas.getContext("2d");
        const canvas_buffer = canvas_context.getImageData(0, 0, canvasWidth, canvasHeight);

        // let's start by painting the canvas red, pixel by pixel
        // the buffer gets filled with [px 00 r, px 00 g, px 00 b, px 00 a, px 01 r, px 01 g, px 01 b, px 01 a, ...]

        for (let row = 0; row < canvasHeight; row++) {
            for (let col = 0; col < canvasWidth; col++) {
                const redIndex = 4 * (canvasWidth * row + col);
                canvas_buffer.data[redIndex] = 255; // r
                canvas_buffer.data[redIndex + 1] = 0; // g
                canvas_buffer.data[redIndex + 2] = 0; // b
                canvas_buffer.data[redIndex + 3] = 255 // a
            }
        }

        canvas_context.putImageData(canvas_buffer, 0, 0);


        // we're going to use a left-handed coordinate system, where the camera points toward the +Z axis


        // let's now start describing our scene

        const camera = {
            center: {
                x: 0,
                y: 0,
                z: 0
            },
            direction: {
                x: 0,
                y: 0,
                z: 1
            }
        };

        const spheres = [
            {
                name: "s1",
                center: {
                    x: -0.5,
                    y: 0.5,
                    z: 2.0
                },
                radius: 0.2,
                color: "red"
            },
            {
                name: "s2",
                center: {
                    x: 0,
                    y: 0,
                    z: 1.5
                },
                radius: 0.15,
                color: "green"
            },
            {
                name: "s3",
                center: {
                    x: 0.5,
                    y: -0.5,
                    z: 2.5
                },
                radius: 0.25,
                color: "blue"
            }
        ];

        // let's define the viewport with two points so that its plane is implied
        const viewport = {
            topLeft: {
                x: -1.0,
                y: 1.0,
                z: 1.0
            },
            bottomRight: {
                x: 1.0,
                y: -1.0,
                z: 1.0
            },
            get top() {
                return this.topLeft.y;
            },
            get bottom() {
                return this.bottomRight.y;
            },
            get left() {
                return this.topLeft.x;
            },
            get right() {
                return this.bottomRight.x;
            },
            get height() {
                return this.top - this.bottom;
            },
            get width() {
                return this.right - this.left;
            }
        };


        // now that the scene is set up, we can actually render it to the canvas

        // let's begin setting up the ray tracer
        // we will be casting one ray per pixel, from the camera center to the pixel center

        const pixelWidth = viewport.width / canvasWidth;
        const pixelHeight = viewport.height / canvasHeight;

        for (let row = 0; row < canvasHeight; row++) {
            for (let col = 0; col < canvasWidth; col++) {
                // determine the location in 3D of the center of this pixel

                const pixelCenter = {
                    x: viewport.left + (pixelWidth / 2) + (col * pixelWidth),
                    y: viewport.top - (pixelHeight / 2) - (row * pixelHeight),
                    z: viewport.topLeft.z // all pixels are somewhere on the viewport plane
                };
            }
        }






    </script>


</body>
</html>
